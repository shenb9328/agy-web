<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Antigravity Web UI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            },
            dark: {
              bg: '#0f1117',
              sidebar: '#161922',
              card: '#1e2230',
              border: '#2a2f42',
              hover: '#262b3d'
            }
          }
        }
      }
    }
  </script>
  <!-- Marked.js & Highlight.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  
  <style>
    /* Mobile-first dynamic viewport height */
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f1117;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2e344a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3d4563; }

    /* Markdown prose styles */
    .prose pre {
      background-color: #141721 !important;
      border: 1px solid #2a2f42;
      border-radius: 0.5rem;
      padding: 0.85rem;
      position: relative;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      overflow-x: auto;
    }
    .prose code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.825rem;
    }
    .prose :not(pre) > code {
      background-color: #242938;
      color: #93c5fd;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      border: 1px solid #333a4f;
    }
    .prose p { margin-bottom: 0.65rem; line-height: 1.6; }
    .prose ul, .prose ol { margin-left: 1.15rem; margin-bottom: 0.65rem; }
    .prose ul { list-style-type: disc; }
    .prose ol { list-style-type: decimal; }
    .prose table { width: 100%; border-collapse: collapse; margin-bottom: 0.75rem; font-size: 0.825rem; }
    .prose th, .prose td { border: 1px solid #2a2f42; padding: 0.4rem 0.6rem; text-align: left; }
    .prose th { background-color: #1a1e2b; }
    .prose blockquote { border-left: 3px solid #8b5cf6; padding-left: 0.75rem; color: #9ca3af; margin: 0.5rem 0; }

    .copy-btn {
      position: absolute;
      top: 0.4rem;
      right: 0.4rem;
      padding: 0.2rem 0.45rem;
      font-size: 0.7rem;
      background: #242938;
      border: 1px solid #3b4259;
      border-radius: 0.35rem;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      -webkit-user-select: none;
      z-index: 10;
    }
    .copy-btn:hover { background: #333a4f; color: #f8fafc; }
    .cursor-blink::after {
      content: '▋';
      display: inline-block;
      vertical-align: baseline;
      animation: blink 1s step-end infinite;
      color: #8b5cf6;
      margin-left: 2px;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Enable selection across chat and markdown */
    #chat-messages,
    #chat-messages *,
    .prose,
    .prose *,
    .whitespace-pre-wrap,
    code,
    pre,
    textarea,
    input {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    ::selection {
      background-color: #4f46e5;
      color: #ffffff;
    }
    ::-webkit-selection {
      background-color: #4f46e5;
      color: #ffffff;
    }
  </style>
</head>
<body class="text-slate-100 flex h-full w-full overflow-hidden antialiased">

  <!-- Mobile Sidebar Backdrop Overlay -->
  <div id="sidebar-overlay" onclick="closeSidebar()"
       class="hidden fixed inset-0 bg-black/70 backdrop-blur-xs z-40 lg:hidden transition-opacity duration-300"></div>

  <!-- Left Sidebar (Drawer on mobile/foldables, Static on large screens) -->
  <aside id="sidebar"
         class="fixed inset-y-0 left-0 z-50 w-72 sm:w-80 bg-dark-sidebar border-r border-dark-border flex flex-col flex-shrink-0 transition-transform duration-300 ease-in-out transform -translate-x-full lg:translate-x-0 lg:static shadow-2xl lg:shadow-none">
    
    <!-- Sidebar Header -->
    <div class="p-3.5 border-b border-dark-border flex items-center justify-between flex-shrink-0">
      <div class="flex items-center space-x-2.5 min-w-0">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-600/30 flex-shrink-0">
          <svg class="w-4 h-4 text-white fill-current" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.93V18a1 1 0 0 1-2 0v-1.07A7 7 0 0 1 5.07 11H6a1 1 0 0 1 0-2h-.93A7 7 0 0 1 11 5.07V6a1 1 0 0 1 2 0v-.93A7 7 0 0 1 18.93 11H18a1 1 0 0 1 0 2h.93A7 7 0 0 1 13 16.93z"/></svg>
        </div>
        <div class="min-w-0">
          <h1 class="font-bold text-xs tracking-wide text-slate-100 truncate">Antigravity Web</h1>
          <div class="flex items-center text-[10px] text-emerald-400 space-x-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="active-user-badge" class="truncate">环境就绪</span>
          </div>
        </div>
      </div>
      <!-- Close drawer button on mobile -->
      <button onclick="closeSidebar()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-dark-hover transition lg:hidden" title="关闭侧边栏">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Quick Action Buttons -->
    <div class="p-2.5 border-b border-dark-border space-y-2 flex-shrink-0">
      <div class="flex space-x-1.5">
        <button onclick="createNewConversation(); closeSidebarOnMobile();" class="flex-1 bg-brand-600 hover:bg-brand-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center justify-center space-x-1 shadow-md shadow-brand-600/20 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span>新对话</span>
        </button>
        <button onclick="promptCreateProject()" class="bg-dark-card hover:bg-dark-hover text-slate-200 border border-dark-border px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center justify-center space-x-1 transition" title="创建新项目目录">
          <svg class="w-3.5 h-3.5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          <span>新项目</span>
        </button>
      </div>
      <!-- Search Filter -->
      <div class="relative">
        <span class="absolute left-2.5 top-2 text-slate-400 text-xs">🔍</span>
        <input id="search-input" type="text" placeholder="搜索项目或会话..." oninput="filterTree()"
               class="w-full bg-dark-bg border border-dark-border rounded-lg pl-7 pr-2.5 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
      </div>
    </div>

    <!-- Tree View Scroll Container (Sorted by time descending) -->
    <div class="flex-1 overflow-y-auto p-2.5 space-y-2" id="tree-container">
      <div class="text-center text-xs text-slate-500 py-8">正在读取本地项目与会话树...</div>
    </div>

    <!-- Bottom Status Bar -->
    <div class="border-t border-dark-border bg-dark-card/50 p-2.5 flex items-center justify-between text-[11px] text-slate-400 flex-shrink-0">
      <div class="flex items-center space-x-1">
        <span>⏱️</span>
        <span>按最新时间排序</span>
      </div>
      <button onclick="openQuotaModal()" class="text-brand-400 hover:text-brand-300 transition flex items-center space-x-1">
        <span>配额详情</span>
      </button>
    </div>
  </aside>

  <!-- Main Chat Section (Takes full width on mobile/foldable) -->
  <main class="flex-1 flex flex-col w-full h-full min-w-0 overflow-hidden bg-dark-bg">
    
    <!-- Top Header (Clean, responsive, never overflows) -->
    <header class="h-12 sm:h-14 border-b border-dark-border px-3 sm:px-4 flex items-center justify-between flex-shrink-0 bg-dark-sidebar/50 backdrop-blur z-10">
      
      <!-- Left: Menu Button & Title -->
      <div class="flex items-center space-x-2 min-w-0 flex-1 mr-2">
        <button id="show-sidebar" onclick="openSidebar()"
                class="text-slate-300 hover:text-white p-1.5 -ml-1 rounded-lg hover:bg-dark-hover transition lg:hidden flex-shrink-0"
                title="打开侧边栏">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="min-w-0 flex-1">
          <h2 id="current-chat-title" class="text-xs sm:text-sm font-semibold text-slate-100 truncate">
            Antigravity 对话
          </h2>
          <div id="current-folder-breadcrumb" class="text-[10px] sm:text-[11px] text-slate-400 truncate">
            📁 默认工作区
          </div>
        </div>
      </div>

      <!-- Right: Responsive Controls -->
      <div class="flex items-center space-x-1.5 sm:space-x-2 flex-shrink-0">
        
        <!-- Bidirectional Sync Status Badge -->
        <div id="sync-status-badge" onclick="checkBridgeStatus(true)"
             class="flex items-center space-x-1 bg-dark-card border border-dark-border rounded-lg px-2 py-1 text-xs cursor-pointer hover:border-slate-500 transition"
             title="点击检测与 Google Antigravity Remote 的双向同步连接">
          <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="sync-status-text" class="text-[10px] sm:text-[11px] text-slate-200 hidden sm:inline font-medium">双向同步</span>
        </div>

        <!-- Project Selector Dropdown -->
        <div class="flex items-center bg-dark-card border border-dark-border rounded-lg px-2 py-1 text-xs" title="切换当前对话所属项目">
          <span class="mr-1 text-xs">📁</span>
          <select id="project-select" onchange="changeActiveProject(this.value)"
                  class="bg-transparent text-slate-200 focus:outline-none text-[11px] sm:text-xs cursor-pointer font-medium max-w-[90px] sm:max-w-[140px] truncate">
            <!-- Dynamically populated -->
          </select>
        </div>

        <!-- Model Selector Dropdown -->
        <div class="flex items-center bg-dark-card border border-dark-border rounded-lg px-2 py-1 text-xs" title="选择运行模型">
          <select id="model-select" onchange="changeActiveModel(this.value)"
                  class="bg-transparent text-slate-200 focus:outline-none text-[11px] sm:text-xs cursor-pointer font-medium max-w-[85px] sm:max-w-[130px] truncate">
            <option value="gemini-3.8-flash">Flash 3.8</option>
            <option value="gemini-3.1-pro">Pro 3.1</option>
            <option value="claude-sonnet-4.6">Claude 4.6</option>
            <option value="claude-opus-4.6">Opus 4.6</option>
            <option value="gpt-oss-120b">GPT-OSS</option>
          </select>
        </div>

        <!-- Auto-Approve Toggle -->
        <label class="flex items-center gap-1.5 bg-dark-card border border-dark-border rounded-lg px-2 py-1 text-xs text-slate-300 cursor-pointer hover:border-slate-500 transition select-none" title="关闭时执行系统命令需手动确认；开启后智能体直接自动执行命令">
          <input type="checkbox" id="auto-approve-chk" onchange="toggleAutoApprove(this.checked)" class="w-3.5 h-3.5 accent-emerald-500 rounded cursor-pointer">
          <span class="text-[11px] hidden sm:inline font-medium">⚡ 自动执行</span>
        </label>

        <!-- User Profile Indicator / Logout -->
        <div class="flex items-center space-x-1 bg-dark-card border border-dark-border rounded-lg p-1 text-xs text-slate-300">
          <span id="user-display-name" class="font-medium hidden md:inline px-1 text-[11px]">账户</span>
          <button onclick="handleLogout()" class="text-slate-400 hover:text-red-400 p-0.5 rounded transition" title="退出登录">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </button>
        </div>

      </div>
    </header>

    <!-- Message Scroll Area -->
    <div id="chat-scroller" class="flex-1 overflow-y-auto px-2.5 sm:px-4 py-4 space-y-4">
      <div id="chat-messages" class="max-w-4xl mx-auto space-y-4">
        <!-- Messages rendered here -->
      </div>
    </div>

    <!-- Bottom Input Box -->
    <footer class="p-2.5 sm:p-4 border-t border-dark-border bg-dark-sidebar/40 backdrop-blur flex-shrink-0">
      <div class="max-w-4xl mx-auto relative">
        <div class="bg-dark-card border border-dark-border rounded-xl p-2 shadow-lg focus-within:border-brand-500 transition-colors">
          <textarea id="chat-input" rows="2" placeholder="输入问题或任务需求... (Enter 发送)"
                    onkeydown="handleKeyDown(event)"
                    class="w-full bg-transparent text-slate-100 placeholder-slate-500 text-xs sm:text-sm focus:outline-none resize-none px-1 py-1 max-h-36"></textarea>
          <div class="flex items-center justify-between pt-1 px-1 text-[11px] text-slate-400">
            <div class="flex items-center space-x-1.5 truncate">
              <span class="text-brand-400 truncate" id="input-project-badge"></span>
            </div>
            <div class="flex items-center space-x-1.5 flex-shrink-0">
              <button id="stop-btn" onclick="stopGenerating()" class="hidden bg-red-600/80 hover:bg-red-500 text-white px-2 py-1 rounded-md text-xs font-medium transition">
                <span>停止</span>
              </button>
              <button id="send-btn" onclick="sendMessage()" class="bg-brand-600 hover:bg-brand-500 text-white px-3 py-1 rounded-md text-xs font-medium flex items-center space-x-1 shadow-md shadow-brand-600/20 transition">
                <span>发送</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </main>

  <!-- Login Modal Overlay (Shown when unauthenticated) -->
  <div id="login-modal" class="fixed inset-0 bg-dark-bg/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-dark-sidebar border border-dark-border w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="text-center space-y-1.5">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-600/30 mx-auto text-xl text-white">
          <svg class="w-6 h-6 text-white fill-current" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.93V18a1 1 0 0 1-2 0v-1.07A7 7 0 0 1 5.07 11H6a1 1 0 0 1 0-2h-.93A7 7 0 0 1 11 5.07V6a1 1 0 0 1 2 0v-.93A7 7 0 0 1 18.93 11H18a1 1 0 0 1 0 2h.93A7 7 0 0 1 13 16.93z"/></svg>
        </div>
        <h2 class="text-base font-bold text-slate-100">Antigravity 登录</h2>
        <p class="text-xs text-slate-400">请输入你的账户凭据访问独立会话环境</p>
      </div>

      <form id="login-form" onsubmit="submitLogin(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">用户名</label>
          <input id="login-username" type="text" required placeholder="用户名 (例如: shenb 或 sam)"
                 class="w-full bg-dark-bg border border-dark-border rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">密码</label>
          <input id="login-password" type="password" required placeholder="请输入密码"
                 class="w-full bg-dark-bg border border-dark-border rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
        </div>

        <div id="login-error" class="hidden text-xs text-red-400 text-center py-1"></div>

        <button type="submit" id="login-submit-btn"
                class="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium py-2 rounded-xl text-xs shadow-md shadow-brand-600/25 transition">
          登 录
        </button>
      </form>
    </div>
  </div>

  <!-- Quota Modal -->
  <div id="quota-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-dark-sidebar border border-dark-border w-full max-w-md rounded-2xl p-4 sm:p-5 shadow-2xl space-y-3.5">
      <div class="flex items-center justify-between border-b border-dark-border pb-3">
        <div class="flex items-center space-x-2">
          <span class="text-base">⚡</span>
          <div>
            <h3 class="font-bold text-xs text-slate-100">Antigravity 官方实时配额</h3>
            <p id="quota-user-tier" class="text-[10px] text-slate-400">正在获取账户信息...</p>
          </div>
        </div>
        <div class="flex items-center space-x-1.5">
          <button onclick="fetchQuotaData()" class="p-1.5 rounded-lg hover:bg-dark-hover text-slate-400 hover:text-slate-200 transition cursor-pointer" title="刷新实时配额">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          </button>
          <button onclick="closeQuotaModal()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-dark-hover cursor-pointer">✕</button>
        </div>
      </div>

      <div id="quota-modal-content" class="space-y-2.5 max-h-[60vh] overflow-y-auto pr-0.5 text-xs">
        <div class="py-6 text-center text-slate-400 text-xs">正在查询官方实时配额...</div>
      </div>

      <div class="pt-2 border-t border-dark-border flex items-center justify-between text-[10px] text-slate-500">
        <span>直连 Google CloudCode API 实时计算</span>
        <button onclick="closeQuotaModal()" class="bg-dark-card hover:bg-dark-hover px-3 py-1 rounded-lg text-xs font-medium border border-dark-border text-slate-200 cursor-pointer">关闭</button>
      </div>
    </div>
  </div>

  <!-- Client-Side JavaScript Logic -->
  <script>
    let activeConversationId = null;
    let activeFolderId = 'default';
    let currentModel = 'gemini-3.8-flash';
    let treeData = { folders: [], conversations: [] };
    let isStreaming = false;
    let currentAbortController = null;
    let folderCollapseState = {};
    let currentUser = null;

    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // ──────────────────────────────────────────────────────────────────────────
    // Drawer Control (Mobile & Foldables)
    // ──────────────────────────────────────────────────────────────────────────

    function openSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.remove('-translate-x-full');
      overlay.classList.remove('hidden');
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    }

    function closeSidebarOnMobile() {
      if (window.innerWidth < 1024) {
        closeSidebar();
      }
    }

    // Check Auth and Sync Status on Page Load
    window.addEventListener('DOMContentLoaded', async () => {
      checkBridgeStatus(false);
      await checkAuthStatus();
    });

    async function checkBridgeStatus(interactive = false) {
      try {
        const res = await fetch('/api/bridge/status');
        const data = await res.json();
        const dot = document.getElementById('sync-status-dot');
        const text = document.getElementById('sync-status-text');
        const badge = document.getElementById('sync-status-badge');
        if (!dot || !text || !badge) return;

        if (data.online) {
          dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
          text.innerText = "双向同步";
          text.className = "text-[10px] sm:text-[11px] text-emerald-300 hidden sm:inline font-medium";
          badge.title = `🟢 ${data.mode_text}\n端口: ${data.port}\n${data.description}`;
          if (interactive) {
            alert(`🟢 【双向同步状态】\n\n已成功直连本地 Antigravity Language Server (端口: ${data.port})！\n\n在此发送的对话，将毫秒级双向实时同步至 Google Antigravity Remote (https://antigravity.google.com)；在 Remote 上操作的会话，Web 端亦将即时呈现。`);
          }
        } else {
          dot.className = "w-2 h-2 rounded-full bg-amber-400";
          text.innerText = "本地直驱";

    // ──────────────────────────────────────────────────────────────────────────

    async function checkAuthStatus() {
      try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (data.authenticated) {
          currentUser = data;
          document.getElementById('login-modal').classList.add('hidden');
          document.getElementById('user-display-name').innerText = data.display_name || data.username;
          document.getElementById('active-user-badge').innerText = `已连: ${data.username}`;
          await loadTree(true);
        } else {
          showLoginModal();
        }
      } catch (err) {
        showLoginModal();
      }
    }

    function showLoginModal() {
      document.getElementById('login-modal').classList.remove('hidden');
      document.getElementById('login-username').focus();
    }

    async function submitLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();
      const errBox = document.getElementById('login-error');
      const btn = document.getElementById('login-submit-btn');

      errBox.classList.add('hidden');
      btn.innerText = '正在验证...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          document.getElementById('login-modal').classList.add('hidden');
          document.getElementById('user-display-name').innerText = data.display_name || data.username;
          document.getElementById('active-user-badge').innerText = `已连: ${data.username}`;
          currentUser = data;
          await loadTree(true);
        } else {
          errBox.innerText = data.error || '用户名或密码不正确';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = '连接服务器失败，请稍后重试';
        errBox.classList.remove('hidden');
      } finally {
        btn.innerText = '登 录';
        btn.disabled = false;
      }
    }

    async function handleLogout() {
      if (!confirm('确定退出当前账户吗？')) return;
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } catch (e) {}
      location.reload();
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Tree View & Hierarchy Management
    // ──────────────────────────────────────────────────────────────────────────

    async function loadTree(autoSelectFirst = false) {
      try {
        const res = await fetch('/api/tree');
        if (res.status === 401) {
          showLoginModal();
          return;
        }
        treeData = await res.json();

        updateProjectSelector();
        renderTree(document.getElementById('search-input')?.value || '');

        if (autoSelectFirst && !activeConversationId && treeData.conversations.length > 0) {
          switchConversation(treeData.conversations[0].id);
        } else if (treeData.conversations.length === 0) {
          createNewConversation();
        }
      } catch (err) {
        console.error('Failed to load native tree:', err);
      }
    }

    function updateProjectSelector() {
      const select = document.getElementById('project-select');
      if (!select) return;

      const currentVal = select.value || activeFolderId;
      select.innerHTML = '';

      treeData.folders.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.id;
        opt.innerText = `${f.name} (${f.count})`;
        select.appendChild(opt);
      });

      if (currentVal && Array.from(select.options).some(o => o.value === currentVal)) {
        select.value = currentVal;
      } else if (treeData.folders.length > 0) {
        select.value = treeData.folders[0].id;
        activeFolderId = treeData.folders[0].id;
      }
      updateBreadcrumb();
    }

    function changeActiveProject(folderId) {
      activeFolderId = folderId;
      const folder = treeData.folders.find(f => f.id === folderId);
      updateBreadcrumb();

      if (activeConversationId) {
        fetch(`/api/conversations/${activeConversationId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ project_path: folder ? folder.path : null })
        }).then(() => loadTree(false));
      }
    }

    function updateBreadcrumb() {
      const folder = treeData.folders.find(f => f.id === activeFolderId);
      const breadcrumb = document.getElementById('current-folder-breadcrumb');
      const badge = document.getElementById('input-project-badge');
      const name = folder ? folder.name : '默认工作区';
      if (breadcrumb) breadcrumb.innerText = `📁 ${name}`;
      if (badge) badge.innerText = `[${name}]`;
    }

    function renderTree(filterQuery = '') {
      const container = document.getElementById('tree-container');
      container.innerHTML = '';

      const query = filterQuery.toLowerCase().trim();

      treeData.folders.forEach((folder, idx) => {
        const folderConvs = treeData.conversations.filter(c => c.folder_id === folder.id);
        const matchesFolder = folder.name.toLowerCase().includes(query);
        const matchingConvs = folderConvs.filter(c => c.title.toLowerCase().includes(query));

        if (query && !matchesFolder && matchingConvs.length === 0) return;

        if (folderCollapseState[folder.id] === undefined) {
          folderCollapseState[folder.id] = (idx < 2) ? false : true;
        }
        const isCollapsed = folderCollapseState[folder.id];

        const folderDiv = document.createElement('div');
        folderDiv.className = 'group rounded-xl bg-dark-card/40 border border-dark-border/60 overflow-hidden transition';
        folderDiv.innerHTML = `
          <div class="flex items-center justify-between px-2.5 py-2 rounded-lg hover:bg-dark-hover/80 cursor-pointer text-slate-300 text-xs select-none">
            <div class="flex items-center space-x-1.5 flex-1 min-w-0" onclick="toggleFolderCollapse('${folder.id}')">
              <span id="arrow-${folder.id}" class="text-[10px] text-slate-500 transition-transform duration-200 inline-block"
                    style="transform: ${isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)'}">▼</span>
              <span class="truncate font-semibold text-slate-200">${escapeHtml(folder.name)}</span>
              <span class="text-[10px] text-slate-500 bg-dark-bg px-1 py-0.2 rounded-full border border-dark-border/40">${folderConvs.length}</span>
            </div>
            <div class="flex items-center space-x-1">
              <button onclick="createNewConversation('${folder.id}'); closeSidebarOnMobile();" class="p-1 hover:text-emerald-400 text-slate-400 transition" title="在此项目新建对话">
                ➕
              </button>
            </div>
          </div>
          <div id="children-${folder.id}" class="${isCollapsed ? 'hidden' : ''} px-1 pb-1 space-y-1"></div>
        `;

        const childrenContainer = folderDiv.querySelector(`#children-${folder.id}`);
        const convsToRender = query ? matchingConvs : folderConvs;
        
        if (convsToRender.length === 0) {
          childrenContainer.innerHTML = `<div class="text-[10px] text-slate-500 px-3 py-1 italic">暂无会话，点击 ➕ 新建</div>`;
        } else {
          convsToRender.forEach(conv => {
            childrenContainer.appendChild(createConvNode(conv));
          });
        }

        container.appendChild(folderDiv);
      });
    }

    function createConvNode(conv) {
      const isActive = conv.id === activeConversationId;
      const el = document.createElement('div');
      el.className = `group flex items-center justify-between px-2 py-1.5 rounded-lg text-xs cursor-pointer transition select-none ${

      }`;

      let timeStr = '';
      if (conv.updated_at) {
        try {
          const d = new Date(conv.updated_at);
          timeStr = `${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
        } catch(e) {}
      }

      el.innerHTML = `
        <div class="flex items-center space-x-1.5 flex-1 min-w-0" onclick="switchConversation('${conv.id}'); closeSidebarOnMobile();">
          <span class="text-[11px] ${isActive ? 'text-brand-400' : 'text-slate-500'}">💬</span>
          <span class="truncate">${escapeHtml(conv.title)}</span>
        </div>
        <div class="flex items-center space-x-1 flex-shrink-0">
          <span class="text-[10px] text-slate-500 group-hover:hidden font-mono">${timeStr}</span>
          <div class="hidden group-hover:flex items-center space-x-1">
            <button onclick="promptRenameConversation('${conv.id}', '${escapeHtml(conv.title)}')" class="p-0.5 hover:text-white text-slate-400 transition" title="重命名">✏️</button>
            <button onclick="deleteConversation('${conv.id}')" class="p-0.5 hover:text-red-400 text-slate-400 transition" title="删除">🗑️</button>
          </div>
        </div>
      `;
      return el;
    }

    function toggleFolderCollapse(folderId) {
      const children = document.getElementById(`children-${folderId}`);
      const arrow = document.getElementById(`arrow-${folderId}`);
      const isCurrentlyHidden = children.classList.contains('hidden');

      if (isCurrentlyHidden) {
        children.classList.remove('hidden');
        arrow.style.transform = 'rotate(0deg)';
        folderCollapseState[folderId] = false;
      } else {
        children.classList.add('hidden');
        arrow.style.transform = 'rotate(-90deg)';
        folderCollapseState[folderId] = true;
      }
    }

    function filterTree() {
      const q = document.getElementById('search-input').value;
      renderTree(q);
    }

      await loadTree(false);

        switchConversation(treeData.conversations[0].id);

        createNewConversation();
      }

    // ──────────────────────────────────────────────────────────────────────────
    // Clipboard & Copy Helpers (Works on both HTTPS and HTTP/Mobile contexts)
    // ──────────────────────────────────────────────────────────────────────────

    async function copyToClipboard(text) {
      if (!text) return false;
      // 1. Try modern clipboard API if available and in secure context
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (e) {
          console.warn('navigator.clipboard failed, fallback to execCommand', e);
        }
      }
      // 2. Fallback using hidden textarea for HTTP IP or mobile WebViews
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        textArea.style.top = '-9999px';
        textArea.style.opacity = '0';
        textArea.setAttribute('readonly', '');
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const successful = document.execCommand('copy');
        document.body.removeChild(textArea);
        return successful;
      } catch (err) {
        console.error('Fallback copy error:', err);
        return false;
      }
    }

    async function copyRawText(btn, text) {
      const ok = await copyToClipboard(text);
      const span = btn.querySelector('span') || btn;
      const orig = span.innerText;
      if (ok !== false) {
        span.innerText = '已复制!';
        setTimeout(() => { span.innerText = orig; }, 2000);
      }
    }

    async function copyMsgElement(btn) {
      const card = btn.closest('.bg-dark-card');
      if (!card) return;
      const body = card.querySelector('#asst-body');
      if (!body) return;
      const text = card._rawContent || body.innerText || body.textContent;
      const ok = await copyToClipboard(text);
      const label = btn.querySelector('.copy-label') || btn;
      const orig = label.innerText;
      if (ok !== false) {
        label.innerText = '已复制!';
        btn.classList.add('text-emerald-400');
        setTimeout(() => {
          label.innerText = orig;
          btn.classList.remove('text-emerald-400');
        }, 2000);
      }
    }

    function attachCodeCopyButtons(container) {
      container.querySelectorAll('pre').forEach(pre => {
        if (pre.querySelector('.copy-btn')) return;
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerText = '复制';
        btn.onclick = async (e) => {
          e.stopPropagation();
          const code = pre.querySelector('code')?.innerText || pre.innerText;
          const ok = await copyToClipboard(code);
          if (ok !== false) {
            btn.innerText = '已复制!';
            btn.style.color = '#34d399';
            setTimeout(() => {
              btn.innerText = '复制';
              btn.style.color = '';
            }, 2000);
          }
        };
        pre.appendChild(btn);
      });
    }

    async function sendMessage() {
      if (isStreaming) return;
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';

      if (!activeConversationId) {
        document.getElementById('chat-messages').innerHTML = '';
      }

      appendMessageElement('user', text);
      scrollToBottom();

      const asstDiv = appendMessageElement('assistant', '', '', true);
      const asstBody = asstDiv.querySelector('#asst-body');
      const card = asstDiv.querySelector('.bg-dark-card');
      scrollToBottom();

      isStreaming = true;
      document.getElementById('send-btn').classList.add('hidden');
      document.getElementById('stop-btn').classList.remove('hidden');

      let fullContent = '';
      currentAbortController = new AbortController();

      try {
        const folder = treeData.folders.find(f => f.id === activeFolderId);
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: currentAbortController.signal,
          body: JSON.stringify({
            conversation_id: activeConversationId,
            message: text,
            model: currentModel,
            project_dir: folder ? folder.path : null,
            auto_approve: isAutoApproveEnabled()
          })
        });

        if (response.status === 401) {
          showLoginModal();
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let isDone = false;

        while (!isDone) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunkText = decoder.decode(value, { stream: true });
          const lines = chunkText.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const raw = line.slice(6).trim();
              try {
                const evt = JSON.parse(raw);
                if (evt.type === 'init') {
                  if (evt.conversation_id) {
                    activeConversationId = evt.conversation_id;
                  }
                } else if (evt.type === 'permission_request') {
                  renderPermissionCard(asstBody, evt);
                  scrollToBottom();
                } else if (evt.type === 'delta') {
                  if (evt.content) {
                    fullContent += evt.content;
                    asstBody.innerHTML = marked.parse(fullContent);
                    if (card) card._rawContent = fullContent;
                    attachCodeCopyButtons(asstDiv);
                    scrollToBottom();
                  }
                } else if (evt.type === 'done') {
                  isDone = true;
                  asstBody.classList.remove('cursor-blink');
                  if (card) card._rawContent = fullContent;
                  attachCodeCopyButtons(asstDiv);
                  if (evt.conversation_id) {
                    activeConversationId = evt.conversation_id;
                  }
                  loadTree(false);
                  break;
                }
              } catch (e) {}
            }
          }
        }
        try { await reader.cancel(); } catch (e) {}
      } catch (err) {
        if (err.name !== 'AbortError') {
          asstBody.innerHTML += `<p class="text-red-400 text-xs mt-2">*(连接中断: ${err.message})*</p>`;
        }
      } finally {
        isStreaming = false;
        currentAbortController = null;
        asstBody.classList.remove('cursor-blink');
        document.getElementById('send-btn').classList.remove('hidden');
        document.getElementById('stop-btn').classList.add('hidden');
      }
    }

    function stopGenerating() {
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }
      isStreaming = false;
      document.getElementById('send-btn').classList.remove('hidden');
      document.getElementById('stop-btn').classList.add('hidden');
      const blinks = document.querySelectorAll('.cursor-blink');
      blinks.forEach(el => el.classList.remove('cursor-blink'));
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function scrollToBottom() {
      const scroller = document.getElementById('chat-scroller');
      scroller.scrollTop = scroller.scrollHeight;
    }

    async function openQuotaModal() {
      document.getElementById('quota-modal').classList.remove('hidden');
      await fetchQuotaData();
    }

    function closeQuotaModal() {
      document.getElementById('quota-modal').classList.add('hidden');
    }

    async function fetchQuotaData() {
      const container = document.getElementById('quota-modal-content');
      const tierBadge = document.getElementById('quota-user-tier');
      container.innerHTML = `
        <div class="py-8 text-center space-y-2">
          <div class="inline-block w-4 h-4 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
          <div class="text-xs text-slate-400">正在直连官方 API 查询实时配额...</div>
        </div>
      `;

      try {
        const res = await fetch('/api/quota');
        const data = await res.json();
        if (!data.success && data.error) {
          container.innerHTML = `<div class="p-3 bg-red-950/40 border border-red-800 rounded-lg text-red-300 text-xs">${escapeHtml(data.error)}</div>`;
          return;
        }

        tierBadge.innerText = `当前等级: ${data.tier || 'Antigravity'} · 实时同步`;

        let html = '';
        data.models.forEach(m => {
          const pctVal = Math.max(0, Math.min(100, (m.fraction !== undefined ? m.fraction * 100 : 100)));
          let colorClass = 'bg-emerald-500';
          let textClass = 'text-emerald-400';
          if (pctVal < 30) {
            colorClass = 'bg-rose-500';
            textClass = 'text-rose-400';
          } else if (pctVal < 70) {
            colorClass = 'bg-amber-500';
            textClass = 'text-amber-400';
          }

          html += `
            <div class="p-2.5 rounded-xl bg-dark-bg/80 border border-dark-border space-y-1.5">
              <div class="flex items-center justify-between">
                <div class="font-medium text-slate-100 flex items-center space-x-1.5 min-w-0">
                  <span class="truncate">${escapeHtml(m.name)}</span>
                  <span class="text-[9px] px-1.5 py-0.2 rounded bg-dark-card border border-dark-border/60 text-slate-400 flex-shrink-0">${escapeHtml(m.pool)}</span>
                </div>
                <div class="font-bold text-xs flex-shrink-0 ml-2 ${textClass}">${m.percentage}</div>
              </div>
              <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                <div class="${colorClass} h-full rounded-full transition-all duration-500" style="width: ${pctVal}%"></div>
              </div>
              <div class="flex items-center justify-between text-[10px] text-slate-400 pt-0.5">
                <span class="truncate text-slate-500">${escapeHtml(m.desc)}</span>
                <span class="flex-shrink-0 font-mono text-slate-300 ml-1">${escapeHtml(m.reset_desc)}</span>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<div class="p-3 bg-red-950/40 border border-red-800 rounded-lg text-red-300 text-xs">获取配额失败: ${escapeHtml(err.message)}</div>`;
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text ? String(text).replace(/[&<>"']/g, m => map[m]) : '';
    }

    // ──────────────────────────────────────────────────────────────────────────
    // Interactive Command Permission Card & Auto-Approve
    // ──────────────────────────────────────────────────────────────────────────

    function isAutoApproveEnabled() {
      return localStorage.getItem('agy_auto_approve') === '1';
    }

    function toggleAutoApprove(checked) {
      localStorage.setItem('agy_auto_approve', checked ? '1' : '0');
    }

    function renderPermissionCard(container, perm) {
      const cardId = `perm-card-${perm.step_index}`;
      if (document.getElementById(cardId)) return;

      const card = document.createElement('div');
      card.id = cardId;
      card.className = 'my-3 p-3.5 sm:p-4 bg-slate-900/95 border-2 border-amber-500/70 rounded-xl shadow-2xl backdrop-blur select-text';
      card.innerHTML = `
        <div class="flex items-center gap-2 text-amber-400 font-semibold text-xs sm:text-sm mb-2">
          <svg class="w-4 h-4 sm:w-5 sm:h-5 text-amber-400 animate-pulse flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
          <span>系统命令执行确认</span>
        </div>
        <div class="text-xs text-slate-300 mb-2 font-medium">${escapeHtml(perm.description || '智能体申请在主机执行以下系统命令：')}</div>
        <pre class="text-xs font-mono bg-black/80 text-emerald-400 p-2.5 rounded-lg border border-slate-700/80 mb-3 overflow-x-auto select-all whitespace-pre-wrap"><code>${escapeHtml(perm.command)}</code></pre>
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="respondPermission('${perm.cascade_id}', '${perm.trajectory_id}', ${perm.step_index}, true, 'PERMISSION_SCOPE_ONCE', this)"
                  class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-medium rounded-lg transition shadow flex items-center gap-1.5 cursor-pointer">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            允许执行 (本次)
          </button>
          <button onclick="respondPermission('${perm.cascade_id}', '${perm.trajectory_id}', ${perm.step_index}, true, 'PERMISSION_SCOPE_CONVERSATION', this)"
                  class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white text-xs font-medium rounded-lg transition shadow flex items-center gap-1.5 cursor-pointer">
            ✓ 本会话始终允许
          </button>
          <button onclick="respondPermission('${perm.cascade_id}', '${perm.trajectory_id}', ${perm.step_index}, false, 'PERMISSION_SCOPE_ONCE', this)"
                  class="px-3 py-1.5 bg-slate-700 hover:bg-rose-600 active:scale-95 text-slate-200 hover:text-white text-xs font-medium rounded-lg transition cursor-pointer">
            ✕ 拒绝执行
          </button>
        </div>
      `;
      container.appendChild(card);
    }

    async function respondPermission(cascadeId, trajectoryId, stepIndex, allow, scope, btn) {
      const card = document.getElementById(`perm-card-${stepIndex}`);
      if (card) {
        card.querySelectorAll('button').forEach(b => {
          b.disabled = true;
          b.classList.add('opacity-50', 'cursor-not-allowed');
        });
        const statusDiv = document.createElement('div');
        statusDiv.className = 'text-xs text-slate-300 mt-2.5 flex items-center gap-1.5';
        statusDiv.innerHTML = allow 
          ? '<span class="text-emerald-400 font-medium">✓ 已确认允许，正在执行命令并继续生成...</span>'
          : '<span class="text-rose-400 font-medium">✕ 已拒绝该命令，正在通知智能体...</span>';
        card.appendChild(statusDiv);
      }
      try {
        await fetch('/api/cascade/interact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cascade_id: cascadeId,
            trajectory_id: trajectoryId,
            step_index: stepIndex,
            allow: allow,
            scope: scope
          })
        });
      } catch (err) {
        console.error('Permission interact error:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const chk = document.getElementById('auto-approve-chk');
      if (chk) chk.checked = isAutoApproveEnabled();
    });
  </script>
</body>
</html>
