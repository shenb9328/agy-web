    <path fill="#ffffff" d="M0 -10 A10 10 0 1 0 0 10 A10 10 0 0 0 0 -10 Z M1 4.93 V6 A1 1 0 0 1 -1 6 V4.93 A7 7 0 0 1 -4.93 1 H-4 A1 1 0 0 1 -4 -1 H-4.93 A7 7 0 0 1 -1 -4.93 V-4 A1 1 0 0 1 1 -4 V-4.93 A7 7 0 0 1 4.93 -1 H4 A1 1 0 0 1 4 1 H4.93 A7 7 0 0 1 1 4.93 Z" />
    <!-- Center Core Dot -->
    <circle cx="0" cy="0" r="2.2" fill="#ffffff" />
  </g>
</svg>